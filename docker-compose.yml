services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file: .env
    environment:
      SM_TECHNO_DB_PATH: /data/stock_sync.db
      SM_TECHNO_STORAGE_ROOT: /storage
      SM_TECHNO_ALLOWED_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ${SM_TECHNO_HOST_ROOT:-/srv/sm-techno-test}/data:/data
      - ${SM_TECHNO_HOST_ROOT:-/srv/sm-techno-test}/storage:/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    environment:
      BACKEND_API_BASE_URL: http://backend:8000
    ports:
      - "${SM_TECHNO_FRONTEND_BIND:-127.0.0.1}:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
