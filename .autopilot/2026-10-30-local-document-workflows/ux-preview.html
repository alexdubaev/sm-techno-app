<style>
:root{--ink:#11223c;--muted:#64748b;--line:#dce3ec;--bg:#f3f5f8;--yellow:#ffcf00;--soft:#f8fafc;--green:#18724c;--red:#b83232}*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}button,input,select{font:inherit}button,a,input,select{outline-offset:4px}button{cursor:pointer}button:disabled{cursor:default;opacity:.45}a{color:inherit}aside{position:fixed;inset:0 auto 0 0;width:228px;background:white;border-right:1px solid var(--line);padding:28px 20px;z-index:4}.brand{font-size:25px;letter-spacing:-1px;font-weight:850}.brand span{background:var(--yellow);padding:0 5px}.caption{font-size:11px;color:var(--muted);letter-spacing:.09em;text-transform:uppercase;margin:25px 10px 9px}nav button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:11px 13px;border-radius:9px;color:var(--ink);margin:3px 0;font-weight:550}nav button.active{background:var(--ink);color:white}.navsub{margin-left:12px}.navsub button{font-size:13px;padding:8px 13px}.prototype{position:sticky;top:0;z-index:3;background:#fff9d9;border-bottom:1px solid #eed878;padding:9px 28px;font-size:12px;display:flex;gap:16px;justify-content:space-between}.prototype b{color:#5a4b06}main{margin-left:228px;min-height:100vh}.page{max-width:1450px;margin:auto;padding:32px 38px 60px}h1{font-size:28px;letter-spacing:-.7px;margin:0 0 6px;line-height:1.3}h2{font-size:18px;margin:0 0 8px;line-height:1.4}h3{font-size:15px;margin:0 0 6px}.muted{color:var(--muted)}.small{font-size:12px}.pagehead{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:27px}.pagehead p{margin:0;max-width:720px}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;min-height:41px;padding:9px 15px;border:1px solid var(--line);border-radius:9px;background:white;color:var(--ink);font-weight:600;text-decoration:none;line-height:1.4}.btn.primary{background:var(--yellow);border-color:var(--yellow)}.btn.text{background:transparent;border-color:transparent;padding:7px 0;text-decoration:underline;text-underline-offset:3px;min-height:30px;font-weight:500}.card{background:white;border:1px solid var(--line);border-radius:13px;padding:23px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:30px}.actioncard{padding:24px;display:flex;flex-direction:column;align-items:flex-start;min-height:245px}.actioncard p{color:var(--muted);margin:7px 0 20px;flex:1}.icon{display:grid;place-items:center;width:39px;height:42px;background:#fff4bc;border-radius:9px;font-size:22px;margin-bottom:19px}.icon svg{width:23px;stroke:var(--ink);fill:none;stroke-width:1.5}.grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px}.stack{display:grid;gap:18px}.notice{background:#f5f8fd;border:1px solid #d7e2f2;border-radius:9px;padding:13px 15px}.notice.warn{background:#fffbed;border-color:#eed68d}.notice.success{background:#f0faf4;border-color:#b8dfc8}.tag{display:inline-block;font-size:11px;padding:3px 8px;border-radius:6px;background:#eef2f7;white-space:nowrap}.tag.good{background:#e5f4ec;color:var(--green)}.tag.warn{background:#fff2d7;color:#845b08}.tag.bad{background:#fceaea;color:var(--red)}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:left;font-size:13px}th{font-weight:550;color:var(--muted);background:var(--soft);font-size:12px}th,td{padding:13px 12px;border-bottom:1px solid #e9edf3;vertical-align:middle}tr:last-child td{border-bottom:0}.right{text-align:right}td a,button.link{color:#245598;font-weight:550;background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px;font-size:inherit}.drop{min-height:258px;border:1.5px dashed #b7c4d5;border-radius:12px;background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:11px;padding:30px;transition:background .15s,border-color .15s}.drop.over{background:#fff9df;border-color:#cda600}.drop p{margin:0}.drop svg{width:37px;height:37px;stroke:#8091a8;fill:none;stroke-width:1.5}.drop h2{margin:0}.file{padding:14px 17px;border:1px solid var(--line);border-radius:9px;background:var(--soft);display:flex;justify-content:space-between;gap:14px;align-items:center}.steps{display:flex;gap:24px;margin:0 0 24px;padding:0;list-style:none;font-size:12px;color:var(--muted)}.steps li{display:flex;gap:7px;align-items:center}.steps span{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;background:#e8edf4;font-size:11px;font-weight:650}.steps li.current{color:var(--ink);font-weight:650}.steps li.current span{background:var(--yellow)}.steps li.done span{background:#dceee3;color:var(--green)}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.field{display:grid;gap:5px;font-size:12px;color:#536279}.field.full{grid-column:1/-1}input,select{width:100%;min-height:39px;padding:9px 11px;border:1px solid #d5ddea;border-radius:7px;background:white;color:var(--ink);font-size:13px}table input{min-width:70px;padding:6px 8px;min-height:32px}.footer{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-top:23px;padding-top:20px;border-top:1px solid var(--line)}.back{display:inline-block;font-size:12px;text-decoration:none;color:var(--muted);margin-bottom:14px}.stats{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:20px}.stats b{display:block;font-size:24px}.stats span{color:var(--muted);font-size:12px}.tabs{display:flex;gap:25px;border-bottom:1px solid var(--line);margin:0 0 23px}.tabs button{background:transparent;border:0;border-bottom:2px solid transparent;padding:11px 0;color:var(--muted);font-weight:600}.tabs button.selected{border-bottom-color:var(--yellow);color:var(--ink)}.resultfile{display:flex;align-items:center;gap:16px;padding:24px 0}.resultfile .icon{margin:0}.spacer{height:15px}.empty{padding:28px;text-align:center;color:var(--muted)}#toast{position:fixed;bottom:25px;left:calc(50% + 114px);transform:translateX(-50%);max-width:540px;background:var(--ink);color:white;padding:13px 20px;border-radius:10px;z-index:10;box-shadow:0 10px 25px #11223c22;display:none}.help{padding-top:20px;font-size:12px;color:var(--muted)}.radio{display:flex;gap:9px;align-items:flex-start;font-size:13px}.radio input{width:17px;min-height:17px;margin-top:3px}.search{max-width:360px}.line{height:1px;background:var(--line);margin:18px 0}.doclist{display:grid;gap:12px}.docrow{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:15px 0;border-bottom:1px solid var(--line)}.docrow:last-child{border:0}.docrow p{margin:3px 0}.light{font-weight:400}.error{color:var(--red);font-size:13px;margin-top:14px}
@media(max-width:1100px){.grid{grid-template-columns:minmax(0,1fr)}.cards{gap:10px}.actioncard{padding:17px}.page{padding:25px}.pagehead{flex-wrap:wrap}}@media(max-width:760px){aside{position:static;width:100%;padding:15px 20px;border-right:0;border-bottom:1px solid var(--line)}aside .caption,.navsub,aside .small{display:none}.brand{font-size:20px}nav{display:flex;gap:5px;margin-top:10px}nav button{width:auto;padding:8px 12px;margin:0;font-size:12px}main{margin:0}.prototype{position:static;padding:8px 18px;display:block}.prototype span{display:block}.page{padding:23px 18px}.cards{grid-template-columns:1fr}.actioncard{min-height:auto}.actioncard .icon{margin-bottom:12px}.fields{grid-template-columns:1fr}.field.full{grid-column:auto}.steps{gap:12px;flex-wrap:wrap}.pagehead{gap:12px}h1{font-size:25px}.footer{align-items:stretch;flex-direction:column}.docrow{align-items:flex-start;flex-direction:column;gap:8px}#toast{left:50%;width:90%}.prototype span:last-child{display:none}}
aside{overflow-y:auto;padding:18px 14px}nav details{margin:4px 0}nav summary{cursor:pointer;list-style:none;padding:9px 10px;font-weight:600}nav summary:after{content:'⌄';float:right;color:#94a3b8}nav details button{padding:7px 12px 7px 23px;font-size:13px;margin:1px 0}.role{font-size:10px;color:#8792a3;float:right}.userbox{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;font-size:12px}.crm-side{position:static;width:auto;z-index:auto;padding:23px}.page{padding:24px 24px 60px}h1{font-size:23px}.card{border-radius:9px;padding:18px}.pagehead{margin-bottom:18px}@media(max-width:760px){aside{overflow:visible}nav{display:block;max-height:230px;overflow:auto}nav details button{width:100%}.crm-side{display:block}.tabs{overflow-x:auto;gap:16px}}
.overlay{position:fixed;inset:0;background:#07162e66;z-index:8;overflow:auto;padding:30px}.crm-modal{max-width:1150px;margin:auto;background:white;border-radius:22px;padding:24px;box-shadow:0 24px 64px #07162e44}.crm-modal .card{background:#f8fafc}.crm-modal .cards{align-items:start}@media(max-width:760px){.overlay{padding:8px}.crm-modal{padding:16px}.crm-modal .cards{grid-template-columns:1fr!important}}
.legacy{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:9px;background:white}
</style>
<aside><img src="logo.png" alt="СМ Техно" style="display:block;width:185px;max-width:100%;margin:0 auto 20px"><div class="userbox"><b>Демонстрационный менеджер</b><br><span class="muted small">Пользователь</span></div><nav aria-label="Главные разделы"><details open><summary>Личный кабинет</summary><button id="nav-manager" onclick="go('manager')">Кабинет</button></details><details open><summary>Прайсы</summary><button id="nav-stock" onclick="go('stock')">Остатки</button><button id="nav-price" onclick="go('price')">Работа с прайсом <span class="role">админ</span></button><button id="nav-invoice" onclick="go('invoice')">Работа со счетом</button><button id="nav-orders" onclick="go('orders')">Заказы</button></details><details open><summary>Коммерческие предложения</summary><button id="nav-offer" onclick="go('offer')">Создать КП</button><button id="nav-offerjournal" onclick="go('offerjournal')">Журнал КП</button></details><details open><summary>Клиенты</summary><button id="nav-crm" onclick="go('crm')">CRM</button><button id="nav-clients" onclick="go('clients')">Клиенты</button></details><details open><summary>Документы</summary><button id="nav-docs" onclick="go('docs')">Документы</button><button id="nav-journal" onclick="go('journal')">Журнал документов</button></details><details open><summary>Администрирование</summary><button id="nav-references" onclick="go('references')">Справочники</button><button id="nav-settings" onclick="go('settings')">Настройки <span class="role">админ</span></button></details></nav></aside>
<main><div class="prototype"><b>Макет · данные демонстрационные · файлы не отправляются</b><span>Действия показаны для обсуждения; изменения не сохраняются.</span><button class="link" onclick="reset()">Начать заново</button></div><div class="page" id="content"></div></main><div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l4 4v14H6zM14 3v5h4M9 12h6M9 16h6"/></svg>';
let state;function reset(){state={page:'docs',file:null,flow:null,step:0,stockStep:0,stockFile:null,clientMode:'existing',hasContract:true,generated:[],crmTab:'Обзор',reviewFields:{contract:{},spec:{}},invoiceQty:2,archiveFile:null,resumeSpec:false};go('docs')}
const client='ООО «Пример клиента»';
function toast(s){$('#toast').textContent=s;$('#toast').style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').style.display='none',4500)}
function go(page){if(state.page==='stock'&&page!=='stock'){state.stockFile=null;state.stockStep=0}if(page==='crm'&&['result','detail'].includes(state.page)){state.crmOpen=true;state.crmDocs=true}state.page=page;document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));$('#nav-'+(['contract','spec','archive','result','detail'].includes(page)?'docs':page))?.classList.add('active');render();window.scrollTo(0,0)}
function header(title,sub,extra=''){return `<div class="pagehead"><div><h1>${title}</h1><p class="muted">${sub}</p></div>${extra}</div>`}
function steps(n,labels){return '<ol class="steps">'+labels.map((s,i)=>`<li class="${i===n?'current':i<n?'done':''}"><span>${i<n?'✓':i+1}</span>${s}</li>`).join('')+'</ol>'}
function drop(kind,title,sub){return `<div class="drop" data-drop="${kind}" tabindex="0" role="group" aria-label="${title}"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 22V5m-6 6 6-6 6 6M5 21v6h22v-6"/></svg><h2>${title}</h2><p class="muted">${sub}</p><label class="btn"><input type="file" style="position:absolute;width:1px;height:1px;opacity:0" data-file="${kind}" ${kind==='spec'?'accept=".docx"':''}>Выбрать файл</label></div><div class="help">Чтобы пройти сценарий без своего файла: <button class="link" onclick="example('${kind}')">попробовать на примере</button>. Макет не распознаёт содержимое загруженного файла.</div><p class="error" id="file-error" role="alert"></p>`}
function example(k){loadFile(k,k==='spec'?'Пример счёта.docx':k==='stock'?'Пример артикулов.xlsx':k==='archive'?'Готовый договор.docx':'Пример реквизитов.pdf')}
function loadFile(k,name){if(k==='spec'&&!/\.docx$/i.test(name)){$('#file-error').textContent='Для спецификации загрузите счёт в формате Word DOCX. Выбранный файл не отправлен.';return}if(k==='stock'){state.stockFile=name;state.stockStep=1}else if(k==='archive'){state.archiveFile=name}else{state.file=name;state.step=1}render()}
function filebar(name,kind){return `<div class="file"><div><b>${esc(name)}</b><div class="muted small">Данные для макета взяты из примера</div></div><button class="link" onclick="changeFile('${kind}')">Заменить файл</button></div>`}
function changeFile(k){if(k==='stock'){state.stockFile=null;state.stockStep=0}else if(k==='archive')state.archiveFile=null;else{state.file=null;state.step=0}render()}
function start(k){state.flow=k;state.clientMode='existing';if(k==='spec'&&state.resumeSpec){state.resumeSpec=false}else{state.file=null;state.step=0}go(k)}
function docs(){return header('Документы','Создавайте договоры и спецификации здесь. Готовые файлы автоматически появятся в карточке клиента CRM.')+`<div class="cards"><section class="card actioncard"><div class="icon">${icon}</div><h2>Создать договор</h2><p>Перетащите реквизиты. Проверьте данные компании и получите договор из вашего шаблона.</p><button class="btn primary" onclick="start('contract')">Создать договор</button></section><section class="card actioncard"><div class="icon">${icon}</div><h2>Создать спецификацию</h2><p>Перетащите счёт Word. Товары, количество, цены и НДС попадут в спецификацию к договору клиента.</p><button class="btn primary" onclick="start('spec')">Создать спецификацию</button></section><section class="card actioncard"><div class="icon">${icon}</div><h2>Загрузить готовый документ</h2><p>Сохраните уже существующий договор или спецификацию, привязав к клиенту CRM.</p><button class="btn" onclick="go('archive')">Загрузить документ</button></section></div><div class="pagehead"><h2>Последние документы</h2><button class="link" onclick="go('journal')">Весь журнал →</button></div>${docTable()}`}
function docTable(){let rows=[...state.generated,{name:'Договор № ДЕМО-001',type:'Договор',version:'Версия 1',origin:'Загружен',file:'Договор_пример.docx'}];return `<div class="card tablewrap" style="padding:0"><table><thead><tr><th>Документ</th><th>Клиент CRM</th><th>Версия</th><th>Источник</th><th></th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td><button class="link" onclick="openDoc(${i})">${esc(r.name)}</button><div class="muted small">${r.type}</div></td><td>${client}</td><td>${r.version}</td><td><span class="tag">${r.origin}</span></td><td><button class="link" onclick="toast('Это макет: в приложении здесь скачивается сохранённый Word.')">Скачать Word</button></td></tr>`).join('')}</tbody></table></div>`}
function journal(){return header('Журнал документов','Все созданные и загруженные договоры и спецификации.',`<button class="btn primary" onclick="go('docs')">Создать документ</button>`)+`<div class="actions" style="margin-bottom:18px"><input class="search" aria-label="Поиск документа" placeholder="Документ, компания или ИНН"><select aria-label="Тип документа" style="width:190px"><option>Все документы</option><option>Договоры</option><option>Спецификации</option></select></div>${docTable()}`}
function clientCard(){let isnew=state.clientMode==='new';return `<section class="card"><h3>Привязка к CRM</h3><div class="spacer"></div><span class="tag ${isnew?'warn':'good'}">${isnew?'Новый клиент':'Найден по ИНН и КПП'}</span><h3 style="margin-top:12px">${client}</h3><p class="muted small">Название для документов и реквизиты из файла</p><p class="small">${isnew?'После вашего подтверждения будет создана карточка CRM и отправлены реквизиты в 1С.':'Документ появится в карточке этого клиента после создания.'}</p><div class="line"></div><button class="link" onclick="showClientChoice()">${isnew?'Выбрать существующего клиента':'Выбрать другого / создать нового'}</button><div id="client-choice" hidden><div class="spacer"></div><label class="field">Клиент CRM<select id="client-choice-value"><option value="existing">${client} · существующий</option><option value="new">Клиента нет — создать нового</option></select></label><p class="small muted">На этом шаге вы только выбираете привязку. Запись будет после проверки данных.</p><button class="btn" onclick="chooseClient()">Выбрать</button></div></section>`}
function showClientChoice(){$('#client-choice').hidden=false;$('#client-choice-value').focus()}
function chooseClient(){state.clientMode=$('#client-choice-value').value;if(state.flow==='spec')state.hasContract=state.clientMode==='existing';render()}
function contractInfo(){return `<section class="card"><h3>Договор клиента</h3>${state.hasContract?`<p><b>№ ДЕМО-001</b><br><span class="muted small">Действующая версия · пример</span></p><p class="small muted">Юридические данные будут взяты из сохранённого договора.</p>`:`<p class="small">У этого клиента ещё нет договора. Для спецификации сначала нужен договор.</p><button class="btn primary" onclick="state.resumeSpec=true;state.savedSpecFile=state.file;start('contract')">Создать договор</button><div class="spacer"></div><button class="btn" onclick="state.resumeSpec=true;state.savedSpecFile=state.file;state.archiveFile=null;go('archive')">Загрузить готовый договор</button><p class="muted small">Счёт останется в текущем сценарии.</p>`}<div class="line"></div><button class="link small" onclick="state.hasContract=!state.hasContract;render()">Макет: ${state.hasContract?'показать случай без договора':'вернуть договор'}</button></section>`}
function field(label,value,full=false){let active=['contract','spec'].includes(state.page);let shown=active?(state.reviewFields[state.page][label]??value):value;return `<label class="field ${full?'full':''}">${label}<input ${active?`data-review="${esc(label)}"`:''} value="${esc(shown)}"></label>`}
function workflow(k){let isSpec=k==='spec',title=isSpec?'Создать спецификацию':'Создать договор';return `<a class="back" href="#" onclick="go('docs');return false">← Документы</a>`+header(title,isSpec?'Загрузите счёт Word DOCX. Юридические данные подтянутся из договора клиента.':'Загрузите реквизиты клиента. Проверьте данные и создайте договор из шаблона.')+steps(state.step,['Загрузить файл','Проверить данные','Готовый документ'])+(state.step===0?`<div class="grid"><section class="card">${drop(k,isSpec?'Перетащите сюда счёт':'Перетащите сюда реквизиты',isSpec?'Word DOCX':'Word, Excel, PDF или фото с телефона')}</section><section class="card"><h3>Что произойдёт дальше</h3><p class="muted">${isSpec?'Проверите строки счёта, найденного клиента и его договор. Затем создадите спецификацию.':'Проверите реквизиты и найденного клиента CRM. Если клиент новый, подтвердите создание карточки.'}</p><p class="small">${isSpec?'Номер спецификации присвоится автоматически в рамках договора.':'Клиент не создаётся и реквизиты не отправляются в 1С до вашего подтверждения.'}</p></section></div>`:`<div class="grid"><div class="stack"><section class="card">${filebar(state.file,k)}<div class="spacer"></div><h2>${isSpec?'Проверьте позиции счёта':'Проверьте реквизиты'}</h2><p class="muted small">Исправьте неточности перед созданием документа.</p>${isSpec?invoiceRows():`<div class="fields">${field('Наименование для документов',client,true)}${field('ИНН','Из файла')}${field('КПП','Из файла')}${field('Юридический адрес','Адрес из реквизитов',true)}${field('Должность руководителя','Должность из реквизитов')}${field('ФИО руководителя','ФИО из реквизитов')}${field('Расчётный счёт','Из реквизитов')}${field('БИК','Из реквизитов')}</div><details style="margin-top:15px"><summary>Остальные реквизиты</summary><div class="spacer"></div><div class="fields">${field('ОГРН','Из реквизитов')}${field('Корреспондентский счёт','Из реквизитов')}${field('Банк','Из реквизитов',true)}${field('Основание полномочий','Из реквизитов',true)}</div></details>`}<div class="notice" style="margin-top:18px">${isSpec?'Условия оплаты и поставки вы заполните в готовом Word.':'Договор будет создан из вашего загруженного шаблона. Условия вы заполните в готовом Word.'}</div><div class="footer"><button class="btn" onclick="changeFile('${k}')">Назад</button><button class="btn primary" ${isSpec&&!state.hasContract?'disabled':''} onclick="generate('${k}')">${state.clientMode==='new'?'Подтвердить клиента и создать ': 'Подтвердить и создать '}${isSpec?'спецификацию':'договор'}</button></div></section></div><div class="stack" style="align-content:start">${clientCard()}${isSpec?contractInfo():`<section class="card"><h3>Один договор клиента</h3><p class="small muted">Если договор уже существует, новая генерация сохранится его следующей версией.</p><p class="small muted">Номер присваивается автоматически.</p></section>`}</div></div>`)}
function invoiceRows(){return `<div class="tablewrap"><table><thead><tr><th>Артикул / товар</th><th>Кол-во</th><th>Цена с НДС, ₽</th><th>НДС, ₽</th><th>Сумма, ₽</th></tr></thead><tbody><tr><td><b>DEMO-001</b><div class="muted small">Товар из примера счёта</div></td><td><input aria-label="Количество" value="${state.invoiceQty}" type="number" min="1" oninput="state.invoiceQty=Number(this.value);$('#inv-total').textContent=(state.invoiceQty*1200).toLocaleString('ru-RU');$('#inv-vat').textContent=(state.invoiceQty*200).toLocaleString('ru-RU')"></td><td>1 200</td><td id="inv-vat">${(state.invoiceQty*200).toLocaleString('ru-RU')}</td><td id="inv-total">${(state.invoiceQty*1200).toLocaleString('ru-RU')}</td></tr></tbody></table></div><p class="muted small">Суммы и НДС показаны на демонстрационном счёте. В приложении данные берутся из загруженного DOCX.</p>`}

function result(){return header('Документ готов','Сохранён в журнале документов и связан с клиентом CRM.')+`<section class="card"><span class="tag good">Готов к скачиванию</span><div class="resultfile"><div class="icon">${icon}</div><div><h2>${esc(state.last?.name??'Документ')}</h2><div class="muted">${client} · Word DOCX</div></div></div><div class="actions"><button class="btn primary" onclick="toast('Это макет: готовый Word будет скачиваться в приложении.')">Скачать Word</button><button class="btn" onclick="go('crm')">Открыть клиента в CRM</button><button class="btn" onclick="go('journal')">В журнал документов</button>${state.resumeSpec?`<button class="btn primary" onclick="state.flow='spec';state.file=state.savedSpecFile;state.step=1;state.resumeSpec=false;go('spec')">Вернуться к счёту и создать спецификацию</button>`:''}</div><div class="notice" style="margin-top:23px">Дополните условия в Word. Готовый файл можно загрузить обратно как новую версию этого же документа.</div></section>`}

клад Б</td><td>3</td><td>1 180</td></tr><tr><td>DEMO-42 · Товар-пример Б</td><td>Склад Б</td><td>7</td><td>820</td></tr><tr><td>DEMO-99</td><td colspan="3"><span class="tag warn">Не найден</span></td></tr></tbody></table></div><div class="footer"><p class="muted small" style="margin:0">Исходный файл и результат обрабатываются временно и не сохраняются в истории.</p><div class="actions"><button class="btn" onclick="state.stockStep=1;render()">Изменить список</button><button class="btn primary" onclick="toast('Это макет: Excel здесь не формируется и не скачивается.')">Скачать Excel</button></div></div>`}</section>`}

function legacy(name,label,admin=false){return `<div class="notice" style="margin-bottom:16px"><b>${label}</b> · снимок существующего интерфейса с демонстрационными данными. Элементы на снимке не интерактивны. ${admin?'Раздел доступен администратору.':''}</div>${name==='settings'||name.startsWith('settings-')?`<div class="actions" style="margin-bottom:12px"><button class="btn" onclick="go('settings')">Настройки</button><button class="btn" onclick="go('settingsUsers')">Пользователи</button><button class="btn" onclick="go('settingsOnec')">1С</button></div>`:''}<img class="legacy" src="legacy-screens/${name}.png" alt="Снимок раздела ${label}">`}
